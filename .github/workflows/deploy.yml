name: Deploy

# Runs after a human merges to main: build, test, publish, smoke-test the published
# site, then release it. The release zip stands in for the production server here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.0.${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Build and unit tests
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Publish
        shell: pwsh
        run: msbuild src/ClaimsAudit.Web/ClaimsAudit.Web.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile /v:minimal /nologo

      - name: Install IIS Express if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\IIS Express\iisexpress.exe")) { choco install iisexpress -y --no-progress }

      - name: Smoke test the published site
        shell: pwsh
        run: ./scripts/smoke.ps1 -SitePath publish

      - name: Release
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "ClaimsAudit-$env:VERSION.zip"
          gh release create "v$env:VERSION" "ClaimsAudit-$env:VERSION.zip" --target $env:GITHUB_SHA `
            --title "v$env:VERSION" --notes "Commit $env:GITHUB_SHA. Smoke test passed. Pipeline run: $env:RUN_URL"

      - name: Tell linked issues
        shell: bash
        run: |
          for pr in $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[].number'); do
            body=$(gh pr view "$pr" --json body -q .body)
            for issue in $(echo "$body" | grep -oiE '(fixes|closes|resolves) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
              gh issue comment "$issue" --body "🚀 Deployed in [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION). Smoke test on the published build passed."
            done
          done

      - name: Report failed deploy
        if: failure()
        shell: bash
        run: |
          gh label create needs-human --color d93f0b --description "Automation gave up, a person has to look" --force > /dev/null
          gh issue create --title "Deploy failed for ${GITHUB_SHA::7}" --label needs-human \
            --body "Deploy of $GITHUB_SHA failed. Nothing was released. Run: $RUN_URL"
