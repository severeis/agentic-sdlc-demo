name: Deploy

# Runs after a human merges to main.
#   build   (GitHub runner): test, publish, smoke-test the published build
#   iis     (self-hosted runner on the server): back up, deploy to IIS, smoke-test, roll back on failure
#   release (GitHub runner): check the public URL, create the release, tell the linked issues

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: http://213.155.29.61
  VERSION: 1.0.${{ github.run_number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: Build and unit tests
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Publish
        shell: pwsh
        run: msbuild src/ClaimsAudit.Web/ClaimsAudit.Web.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishProfile=FolderProfile /v:minimal /nologo

      - name: Install IIS Express if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\IIS Express\iisexpress.exe")) { choco install iisexpress -y --no-progress }

      - name: Smoke test the published build
        shell: pwsh
        run: ./scripts/smoke.ps1 -SitePath publish

      - name: Bundle site and smoke test for the server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item -Recurse publish bundle/site
          Copy-Item scripts/deploy-iis.cmd, scripts/smoke-iis.cmd bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: bundle/

  iis:
    needs: build
    runs-on: [self-hosted, windows, claimsaudit-prod]
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    timeout-minutes: 15
    # The server keeps its PowerShell execution policy, so the steps here are plain cmd scripts.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}\bundle

      - name: Back up current version
        run: call "%RUNNER_TEMP%\bundle\deploy-iis.cmd" backup

      - name: Deploy to IIS
        run: call "%RUNNER_TEMP%\bundle\deploy-iis.cmd" deploy "%RUNNER_TEMP%\bundle\site"

      - name: Smoke test on the server
        id: smoke
        run: call "%RUNNER_TEMP%\bundle\smoke-iis.cmd" http://localhost

      - name: Roll back
        if: failure() && steps.smoke.outcome == 'failure'
        run: call "%RUNNER_TEMP%\bundle\deploy-iis.cmd" rollback

  release:
    needs: iis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: bundle

      - name: Check the public URL
        run: |
          if curl -fsS --max-time 20 "$SITE_URL/" | grep -q "Audit dashboard"; then
            echo "Public site is up: $SITE_URL"
          else
            echo "::warning::$SITE_URL is not reachable from the internet (deploy itself passed the on-server smoke test)"
          fi

      - name: Release
        run: |
          (cd bundle/site && zip -qr "../../ClaimsAudit-$VERSION.zip" .)
          gh release create "v$VERSION" "ClaimsAudit-$VERSION.zip" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes "Commit $GITHUB_SHA, deployed to $SITE_URL. Smoke tests passed on the published build and on the server. Pipeline run: $RUN_URL"

      - name: Tell linked issues
        run: |
          for pr in $(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[].number'); do
            body=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json body -q .body)
            for issue in $(echo "$body" | grep -oiE '(fixes|closes|resolves) #[0-9]+' | grep -oE '[0-9]+' | sort -u); do
              gh issue comment "$issue" -R "$GITHUB_REPOSITORY" --body "🚀 Deployed to $SITE_URL in [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION). Smoke tests passed on the published build and on the server."
            done
          done

  report-failure:
    needs: [build, iis, release]
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open an issue
        run: |
          gh label create needs-human -R "$GITHUB_REPOSITORY" --color d93f0b --description "Automation gave up, a person has to look" --force > /dev/null
          gh issue create -R "$GITHUB_REPOSITORY" --title "Deploy failed for ${GITHUB_SHA::7}" --label needs-human \
            --body "Deploy of $GITHUB_SHA failed. If the server smoke test failed, the previous version was restored automatically. Run: $RUN_URL"
