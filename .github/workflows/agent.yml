name: Agent

# Issue labelled "agent" -> Claude Code fixes it -> PR.
# Reopening an issue that has the "agent" label starts a second pass with the previous PRs and comments.
# Also dispatched by CI / AI review when an agent PR needs another attempt.
# A person can send an agent PR back too: a PR comment starting with "/agent", or a review with "Request changes".

on:
  issues:
    types: [labeled, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: Agent PR to fix
        required: true
      reason:
        description: What sent it back (ci or review)
        required: true
      run_id:
        description: CI run with the failure (for reason=ci)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: agent-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent') ||
      (github.event_name == 'issues' && github.event.action == 'reopened' && contains(github.event.issue.labels.*.name, 'agent')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/agent') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && startsWith(github.event.pull_request.head.ref, 'agent/') && github.event.review.user.type != 'Bot')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_FIX_ATTEMPTS: 2
      MAX_HUMAN_REQUESTS: 5
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check who started it
        if: github.event_name != 'workflow_dispatch'
        env:
          SENDER: ${{ github.event.sender.login }}
          ACTION: ${{ github.event_name }}/${{ github.event.action }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" -q .permission || echo none)
          case "$perm" in
            admin|maintain|write) echo "$ACTION by $SENDER ($perm)" ;;
            triage) [ "$GITHUB_EVENT_NAME" = "issues" ] && echo "$ACTION by $SENDER ($perm)" || { echo "$ACTION by $SENDER ($perm): needs write access to change a PR, ignoring"; exit 1; } ;;
            *) echo "$ACTION by $SENDER without repo access, ignoring"; exit 1 ;;
          esac

      - name: Prepare task
        id: task
        env:
          ISSUE_FROM_EVENT: ${{ github.event.issue.number }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_NUMBER: ${{ inputs.pr }}
          REASON: ${{ inputs.reason }}
          FAILED_RUN: ${{ inputs.run_id }}
          # People's text goes through env, never straight into the script
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_ID: ${{ github.event.review.id }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          mkdir -p agent-out
          for l in "agent:5319e7:Hand this issue to the coding agent" \
                   "agent-pr:0e8a16:Opened by the coding agent" \
                   "needs-human:d93f0b:Automation gave up, a person has to look" \
                   "fix-attempt-1:fbca04:Agent fix attempt 1" \
                   "fix-attempt-2:fbca04:Agent fix attempt 2"; do
            IFS=: read -r name color desc <<< "$l"
            gh label create "$name" --color "$color" --description "$desc" --force > /dev/null
          done

          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            mode=implement
            issue=$ISSUE_FROM_EVENT
            branch="agent/issue-$issue"
            cp .github/agent/implement.md agent-out/prompt.md

            # An earlier agent PR for this issue was merged, yet the issue is back (reopened or
            # labelled again): second pass, with what was tried before and what people said about it.
            gh pr list --state merged --head "$branch" --json number,title,url \
              -q '.[] | "\(.number)\t\(.title)\t\(.url)"' > agent-out/previous-prs.tsv
            if [ -s agent-out/previous-prs.tsv ]; then
              cat .github/agent/reopen.md >> agent-out/prompt.md
              echo >> agent-out/prompt.md
              while IFS=$'\t' read -r n t u; do
                gh pr diff "$n" > "agent-out/previous-pr-$n.diff"
                echo "- PR #$n \"$t\" ($u), merged and deployed. Diff: agent-out/previous-pr-$n.diff" >> agent-out/prompt.md
              done < agent-out/previous-prs.tsv
              gh issue comment "$issue" --body "🤖 The previous fix did not solve this; the agent is taking another look: $RUN_URL"
            else
              gh issue comment "$issue" --body "🤖 Agent picked this up: $RUN_URL"
            fi
          else
            mode=fix
            # A PR comment or review from a person: same fix mode, with their words as the reason
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              PR_NUMBER=$PR_FROM_EVENT
              REASON=human
            fi
            branch=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
            state=$(gh pr view "$PR_NUMBER" --json state -q .state)
            case "$branch" in
              agent/issue-*) ;;
              *) echo "PR #$PR_NUMBER ($branch) is not an agent PR, nothing to do"; echo "mode=stop" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            if [ "$state" != "OPEN" ]; then
              echo "PR #$PR_NUMBER is $state, nothing to do"; echo "mode=stop" >> "$GITHUB_OUTPUT"; exit 0
            fi
            issue=${branch#agent/issue-}
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"

            if [ "$REASON" = "human" ]; then
              # People get their own budget, counted by the agent's replies on the PR
              done=$(gh pr view "$PR_NUMBER" --json comments \
                -q '[.comments[] | select(.body | contains("<!-- agent-human-request -->"))] | length')
              attempt=$((done + 1))
              if [ "$attempt" -gt "$MAX_HUMAN_REQUESTS" ]; then
                gh pr edit "$PR_NUMBER" --add-label needs-human
                gh pr comment "$PR_NUMBER" --body "🤖 This PR has already had $MAX_HUMAN_REQUESTS change requests. Please finish it by hand or file a new issue."
                echo "mode=stop" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # A person's request also gives CI and the AI reviewer a fresh retry budget
              for l in fix-attempt-1 fix-attempt-2 needs-human; do gh pr edit "$PR_NUMBER" --remove-label "$l" > /dev/null 2>&1 || true; done
              if [ -n "$COMMENT_ID" ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null || true
              fi
              printf '🤖 Working on the change requested by %s (request %s of %s): %s\n\n<!-- agent-human-request -->\n' \
                "$SENDER" "$attempt" "$MAX_HUMAN_REQUESTS" "$RUN_URL" > agent-out/ack.md
              gh pr comment "$PR_NUMBER" --body-file agent-out/ack.md
            else
              labels=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')
              attempt=1
              if echo "$labels" | grep -qx fix-attempt-1; then attempt=2; fi
              if echo "$labels" | grep -qx fix-attempt-2; then attempt=3; fi
              if [ "$attempt" -gt "$MAX_FIX_ATTEMPTS" ]; then
                gh pr edit "$PR_NUMBER" --add-label needs-human
                gh pr comment "$PR_NUMBER" --body "🤖 Still failing ($REASON) after $MAX_FIX_ATTEMPTS fix attempts. Handing over to a human."
                echo "mode=stop" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
            git checkout "$branch"
            git show origin/main:.github/agent/fix.md > agent-out/prompt.md

            if [ "$REASON" = "ci" ]; then
              gh run download "$FAILED_RUN" -n build-log -D agent-out/ci || true
              {
                echo; echo "## Why it came back: CI failed"; echo
                echo '```'; tail -n 200 agent-out/ci/build.log 2>/dev/null || echo "(log not available)"; echo '```'
              } >> agent-out/prompt.md
            elif [ "$REASON" = "review" ]; then
              gh pr view "$PR_NUMBER" --json comments \
                -q '[.comments[] | select(.body | contains("<!-- ai-review -->"))] | last | .body' > agent-out/review.md
              { echo; echo "## Why it came back: the AI reviewer requested changes"; echo; cat agent-out/review.md; } >> agent-out/prompt.md
            else
              { echo; git show origin/main:.github/agent/human.md; } >> agent-out/prompt.md
              {
                echo; echo "## Why it came back: $SENDER (maintainer) asked for changes"; echo
                if [ -n "$COMMENT_ID" ]; then
                  printf '%s\n' "${COMMENT_BODY#/agent}"
                else
                  printf '%s\n' "$REVIEW_BODY"
                  inline=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments" \
                    -q '.[] | "- `\(.path)` line \(.line // .original_line // "?"): \(.body)"')
                  if [ -n "$inline" ]; then echo; echo "Comments on lines of the diff:"; echo "$inline"; fi
                fi
              } >> agent-out/prompt.md
            fi
          fi

          {
            echo; echo "## Issue #$issue"; echo
            gh issue view "$issue" --json title,body -q '"### " + .title + "\n\n" + .body'
            # Comments from people (the pipeline's own status comments are left out)
            comments=$(gh issue view "$issue" --json comments \
              -q '.comments[] | select(.author.login | test("github-actions") | not) | "**\(.author.login)** (\(.createdAt)):\n\(.body)\n"')
            if [ -n "$comments" ]; then
              echo; echo "### Comments on the issue"; echo; echo "$comments"
            fi
          } >> agent-out/prompt.md

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "title=$(gh issue view "$issue" --json title -q .title)" >> "$GITHUB_OUTPUT"

      - uses: microsoft/setup-msbuild@v2
        if: steps.task.outputs.mode != 'stop'

      - uses: actions/setup-node@v5
        if: steps.task.outputs.mode != 'stop'
        with:
          node-version: 20

      - name: Run Claude Code
        if: steps.task.outputs.mode != 'stop'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_GIT_BASH_PATH: C:\Program Files\Git\bin\bash.exe
          # The agent gets no GitHub credentials. Committing, pushing and opening the PR are done by this workflow.
          GH_TOKEN: ""
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null
          claude -p \
            --output-format json \
            --max-turns 60 \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "Bash(pwsh -File scripts/test.ps1:*)" "Bash(git diff:*)" "Bash(git status:*)" "Bash(git log:*)" "Bash(git show:*)" \
            < agent-out/prompt.md > agent-out/result.json

      - name: Read agent result
        id: result
        if: steps.task.outputs.mode != 'stop'
        shell: pwsh
        run: |
          $r = Get-Content agent-out/result.json -Raw | ConvertFrom-Json
          $outcome = "blocked"
          if (Test-Path agent-out/outcome.txt) { $outcome = (Get-Content agent-out/outcome.txt -TotalCount 1).Trim().ToLower() }
          if (-not (Test-Path agent-out/summary.md)) { $r.result | Set-Content agent-out/summary.md }
          "outcome=$outcome" >> $env:GITHUB_OUTPUT
          "cost=$([math]::Round([double]$r.total_cost_usd, 2))" >> $env:GITHUB_OUTPUT
          "turns=$($r.num_turns)" >> $env:GITHUB_OUTPUT
          Write-Host "Outcome: $outcome, turns: $($r.num_turns), cost: $($r.total_cost_usd)"

      - name: Agent is blocked
        if: steps.task.outputs.mode != 'stop' && steps.result.outputs.outcome != 'fixed'
        env:
          TARGET: ${{ steps.task.outputs.mode == 'fix' && steps.task.outputs.pr || steps.task.outputs.issue }}
        run: |
          { echo "🤖 **The agent stopped and needs a human.**"; echo; cat agent-out/summary.md; } > agent-out/comment.md
          gh issue comment "$TARGET" --body-file agent-out/comment.md
          gh issue edit "$TARGET" --add-label needs-human

      - name: Guardrails
        id: guardrails
        if: steps.result.outputs.outcome == 'fixed'
        shell: pwsh
        run: ./scripts/guardrails.ps1 -Base origin/main -Mode ${{ steps.task.outputs.mode }}

      - name: Guardrails failed
        if: failure() && steps.guardrails.outcome == 'failure'
        env:
          TARGET: ${{ steps.task.outputs.mode == 'fix' && steps.task.outputs.pr || steps.task.outputs.issue }}
        run: |
          { echo "🤖 **The agent's change was rejected by guardrails, nothing was pushed.**"; echo; echo '```'; cat agent-out/guardrails.txt; echo '```'; } > agent-out/comment.md
          gh issue comment "$TARGET" --body-file agent-out/comment.md
          gh issue edit "$TARGET" --add-label needs-human

      - name: Commit and push
        if: steps.result.outputs.outcome == 'fixed'
        env:
          MODE: ${{ steps.task.outputs.mode }}
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE: ${{ steps.task.outputs.issue }}
          TITLE: ${{ steps.task.outputs.title }}
          ATTEMPT: ${{ steps.task.outputs.attempt }}
          REASON: ${{ steps.task.outputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "implement" ]; then
            git checkout -B "$BRANCH"
            git commit -m "Fix #$ISSUE: $TITLE" -m "Generated by the coding agent: $RUN_URL"
            git push --force origin "$BRANCH"
          else
            if [ "$REASON" = "human" ]; then what="maintainer request $ATTEMPT"; else what="$REASON feedback (attempt $ATTEMPT)"; fi
            git commit -m "Address $what for #$ISSUE" -m "Generated by the coding agent: $RUN_URL"
            git push origin "$BRANCH"
          fi

      - name: Open or update PR
        if: steps.result.outputs.outcome == 'fixed'
        env:
          MODE: ${{ steps.task.outputs.mode }}
          BRANCH: ${{ steps.task.outputs.branch }}
          ISSUE: ${{ steps.task.outputs.issue }}
          TITLE: ${{ steps.task.outputs.title }}
          ATTEMPT: ${{ steps.task.outputs.attempt }}
          PR_NUMBER: ${{ steps.task.outputs.pr }}
          REASON: ${{ steps.task.outputs.reason }}
          COST: ${{ steps.result.outputs.cost }}
          TURNS: ${{ steps.result.outputs.turns }}
        run: |
          footer="<sub>🤖 [agent run]($RUN_URL) · $TURNS turns · \$$COST</sub>"
          if [ "$MODE" = "implement" ]; then
            { cat agent-out/summary.md; echo; echo "Fixes #$ISSUE"; echo; echo "$footer"; } > agent-out/pr-body.md
            pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
            if [ -z "$pr" ]; then
              # The PR API occasionally returns a transient GraphQL error, so retry.
              for i in 1 2 3; do
                url=$(gh pr create --base main --head "$BRANCH" --title "Fix #$ISSUE: $TITLE" --body-file agent-out/pr-body.md) && break
                sleep 15
                url=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
                [ -n "$url" ] && break
              done
              [ -n "$url" ] || { echo "Could not open the PR"; exit 1; }
              pr=${url##*/}
              gh pr edit "$pr" --add-label agent-pr || true
            else
              gh pr edit "$pr" --body-file agent-out/pr-body.md
            fi
            gh issue comment "$ISSUE" --body "🤖 Opened PR #$pr. CI and AI review will run next; a human approves the merge."
          else
            pr=$PR_NUMBER
            if [ "$REASON" = "human" ]; then
              heading="🤖 **Done: requested change $ATTEMPT**"
            else
              gh pr edit "$pr" --add-label "fix-attempt-$ATTEMPT"
              heading="🤖 **Fix attempt $ATTEMPT**"
            fi
            { echo "$heading"; echo; cat agent-out/summary.md; echo; echo "$footer"; } > agent-out/comment.md
            gh pr comment "$pr" --body-file agent-out/comment.md
          fi
          gh workflow run ci.yml -f ref="$BRANCH"
